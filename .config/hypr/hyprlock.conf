##############################################
############## HYPRLOCK CONFIG ###############
##############################################

general {
  ignore_empty_input = true
}

background {
    path = ~/.config/eww/themes/night_sky/images/wallpaper.png 
    color = rgba(9, 4, 9, 0.5)
    blur_passes = 2
    blur_size = 6
}

# Where you put in the password
input-field {
    fade_on_empty = false
    position = 0, -70
    placeholder_text = Input Password
    inner_color = rgba(9, 4, 9, 0.3)
    outline_thickness = 1
    border_color = rgb(090409)
    font_color = rgb(E99AFF)
    font_family = Monocraft
    size = 300, 70
}

shape {
  size = 240, 260
  position = 0, 110
  rounding = 30
  border_color = rgb(090409)
  border_size = 1
  color = rgba(9, 4, 9, 0.3)
}

label {
   text = $USER 
   font_family = Monocraft
   position = 0, 10
}

image {
   path = ~/.config/eww/images/profile_picture.png
   position = 0, 135
}

label {
  position = 0, -500
  font_family = Monocraft
  onclick = "playerctl" play-pause
  text = cmd[update:500] ~/.config/hypr/scripts/lock_player_data.sh
}

shape {
  position = 0, 510
  size = 100, 40
  border_color = rgb(090409)
  border_size = 1
  rounding = 7
  color = rgba(9, 4, 9, 0.3)
}

label {
  text = $TIME
  position = 0, 510
  font_family = Monocraft
  color = rgb(549D9D)
}

shape {
  position = 878, 510
  size = 150, 40
  border_color = rgb(090409)
  border_size = 1
  rounding = 7
  color = rgba(9, 4, 9, 0.3)
}

label {
  position = 878, 510
  font_family = Monocraft
  color = rgb(E07D68) 
  text = cmd[update:500] ~/.config/hypr/scripts/random_info.sh 
}

